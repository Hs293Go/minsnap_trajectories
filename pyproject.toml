[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minsnap_trajectories"
version = "0.3.0"
description = "Simple minimum-snap trajectory generator"
readme = "README.md"
authors = [{ name = "H S Helson Go", email = "hei.go@mail.utoronto.ca" }]
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "trajectory generation",
  "path planning",
  "minimum snap",
  "differential flatness",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.21.5", "scipy>=1.8"]

[dependency-groups]
dev = [
  "hypothesis>=6.152.6",
  "matplotlib>=3.10.9",
  "pytest>=9.0.3",
  # Capped because ruff's formatter changes output across minor releases; 0.16
  # reformats python blocks in README.md. Lift deliberately, not via `--upgrade`.
  "ruff>=0.15.12,<0.16",
]

[project.urls]
Homepage = "https://github.com/Hs293Go/minsnap_trajectories"

[tool.hatch.build.targets.wheel]
packages = ["src/minsnap_trajectories"]

[tool.pytest.ini_options]
pythonpath = "src"
filterwarnings = "ignore::DeprecationWarning"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
  "E741",   # ambiguous variable names (l, I) — common in linear-algebra code
  "RUF012", # mutable class defaults — not relevant here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
